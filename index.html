    background-repeat: repeat, no-repeat;
    background-size: 340px 340px, cover;
    background-attachment: fixed, fixed;
    color:var(--plum-900);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:520px; margin:0 auto; padding-bottom:100px; min-height:100vh; }

  /* HEADER */
  .hero{
    padding:24px 20px 6px;
    position:relative;
  }
  .hero-top{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  .hero-title{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:23px; color:var(--pink-600); margin:0; letter-spacing:0.5px; text-shadow:0 1px 12px rgba(255,255,255,0.5); }
  .hero-sub{ font-size:12.5px; color:var(--plum-700); margin:4px 0 0; }
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.55); color:var(--plum-700); font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    backdrop-filter:blur(2px);
  }
  .icon-btn:active{ transform:scale(0.92); }

  .stat-row{ display:flex; gap:10px; margin-top:16px; position:relative; z-index:1; }
  .stat-card{
    flex:1; background:rgba(255,255,255,0.85); border-radius:16px; padding:10px 12px;
  }
  .stat-label{ font-size:11px; color:var(--plum-500); margin:0 0 2px; }
  .stat-value{ font-family:'Baloo 2',sans-serif; font-size:16px; font-weight:700; color:var(--pink-600); margin:0; }

  /* IDOL AVATARS */
  .idol-scroll{
    display:flex; gap:14px; overflow-x:auto; padding:18px 16px 6px;
    scrollbar-width:none;
  }
  .idol-scroll::-webkit-scrollbar{ display:none; }
  .idol-chip{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; width:58px;
  }
  .idol-avatar{
    width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:19px;
    border:2.5px solid transparent; box-shadow:var(--shadow-soft);
  }
  .idol-chip.active .idol-avatar{ border-color:var(--pink-500); box-shadow:0 0 0 3px var(--pink-100); }
  .idol-chip-label{ font-size:11.5px; color:var(--plum-700); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:58px; }
  .idol-chip.active .idol-chip-label{ color:var(--pink-600); font-weight:700; }
  .idol-chip[data-idol="all"] .idol-avatar{ background:linear-gradient(135deg,var(--lav-400),var(--pink-400)); }
  .idol-chip-add{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px; width:58px; cursor:pointer;
  }
  .idol-chip-add .idol-avatar{
    background:var(--lav-50); border:1.5px dashed var(--lav-400); color:var(--lav-500); font-size:20px; box-shadow:none;
  }

  /* TABS */
  .tabs{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:14px 16px 6px; }
  .tab-btn{
    text-align:center; padding:10px 4px; border-radius:999px;
    border:none; background:var(--white); color:var(--plum-500); font-size:13px; font-weight:500;
    cursor:pointer; box-shadow:var(--shadow-soft);
  }
  .tab-btn.active{
    background:linear-gradient(135deg,var(--pink-500),var(--lav-500)); color:#fff;
  }

  .content{ padding:10px 16px 0; }

  /* FILTER ROW */
  .filter-row{ display:flex; gap:8px; margin:10px 0 14px; overflow-x:auto; scrollbar-width:none; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:0 0 auto; padding:6px 12px; border-radius:999px; font-size:12px;
    border:1px solid var(--pink-200); background:var(--white); color:var(--plum-500); cursor:pointer;
  }
  .filter-chip.active{ background:var(--pink-100); border-color:var(--pink-400); color:var(--pink-700); font-weight:500; }

  /* ITEM CARD */
  .item-card{
    background:var(--white); border-radius:18px; padding:12px; margin-bottom:12px;
    display:flex; gap:12px; box-shadow:var(--shadow-soft); border:1px solid var(--lav-100);
    cursor:pointer;
  }
  .item-photo{
    width:64px; height:64px; border-radius:14px; object-fit:cover; flex:0 0 auto;
    background:var(--pink-50); display:flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--pink-300);
  }
  .item-main{ flex:1; min-width:0; }
  .item-top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .item-name{ font-size:14.5px; font-weight:500; margin:0; color:var(--plum-900); }
  .item-idol{ font-size:11.5px; color:var(--plum-500); margin:2px 0 0; }
  .item-price{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:var(--pink-600); white-space:nowrap; }

  .item-tags{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }

  .tag-trade-free{ background:var(--notarrived-bg); color:var(--notarrived); }
  .tag-trade-list{ background:var(--lav-100); color:var(--lav-600); }

  .photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .photo-grid-item{ position:relative; border-radius:12px; overflow:hidden; aspect-ratio:1/1; cursor:pointer; background:var(--lav-50); box-shadow:var(--shadow-soft); }
  .photo-grid-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-caption{ position:absolute; bottom:0; left:0; right:0; background:rgba(61,38,87,0.55); color:#fff; font-size:10px; padding:3px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lightbox-img{ width:100%; border-radius:16px; display:block; margin-bottom:10px; }
  .item-date{ font-size:10.5px; color:var(--plum-500); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--plum-500); }
  .empty-state .emoji{ font-size:42px; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; margin:4px 0; }
  .empty-cta{
    margin-top:14px; padding:10px 22px; border-radius:999px; border:none;
    background:linear-gradient(135deg,var(--pink-400),var(--pink-500)); color:#fff; font-size:13.5px; font-weight:500; cursor:pointer;
  }

  /* FAB */
  .fab{
    position:fixed; right:24px; bottom:24px; width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,var(--pink-400),var(--pink-600)); color:#fff; font-size:26px;
    border:none; box-shadow:var(--shadow-pink); cursor:pointer; z-index:40;
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ transform:scale(0.94); }
  .app-wrap{ max-width:520px; margin:0 auto; position:relative; }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(74,37,64,0.45); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.center{ align-items:center; padding:20px; }
  .modal-sheet{
    background:var(--cream); width:100%; max-width:520px; border-radius:24px 24px 0 0;
    max-height:88vh; overflow-y:auto; padding:18px 18px 24px;
  }
  .modal-overlay.center .modal-sheet{ border-radius:22px; max-height:85vh; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-size:17px; font-weight:700; margin:0; color:var(--plum-900); }
  .modal-close{ background:none; border:none; font-size:20px; color:var(--plum-500); cursor:pointer; padding:4px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:500; color:var(--plum-700); margin-bottom:6px; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
    width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid var(--pink-200);
    background:#fff; font-size:14px; color:var(--plum-900); font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--pink-400); }
  .seg{ display:flex; gap:8px; }
  .seg-btn{
    flex:1; padding:10px 4px; border-radius:12px; border:1.5px solid var(--pink-200); background:#fff;
    font-size:13px; color:var(--plum-500); cursor:pointer; text-align:center;
  }
  .seg-btn.active{ background:var(--pink-500); border-color:var(--pink-500); color:#fff; font-weight:500; }
  .price-row{ display:flex; gap:8px; }
  .price-row input{ flex:1.4; }
  .price-row select{ flex:1; }
  .converted-hint{ font-size:11.5px; color:var(--plum-500); margin-top:5px; }

  .cat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .cat-opt{
    padding:9px 4px; border-radius:12px; border:1.5px solid var(--pink-200); background:#fff;
    font-size:12px; text-align:center; color:var(--plum-700); cursor:pointer;
  }
  .cat-opt.active{ background:var(--lav-100); border-color:var(--lav-500); color:var(--lav-500); font-weight:500; }

  .photo-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .photo-thumb{ width:64px; height:64px; border-radius:12px; object-fit:cover; position:relative; }
  .photo-thumb-wrap{ position:relative; }
  .photo-remove{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--danger); color:#fff; border:none; font-size:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-add{
    width:64px; height:64px; border-radius:12px; border:1.5px dashed var(--pink-300); background:var(--pink-50);
    color:var(--pink-400); font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .btn-primary{
    width:100%; padding:13px; border-radius:14px; border:none;
    background:linear-gradient(135deg,var(--pink-400),var(--pink-600)); color:#fff; font-size:14.5px; font-weight:500;
    cursor:pointer; margin-top:6px;
  }
  .btn-secondary{
    width:100%; padding:13px; border-radius:14px; border:1.5px solid var(--pink-200);
    background:#fff; color:var(--plum-700); font-size:14px; cursor:pointer; margin-top:8px;
  }
  .btn-danger-text{
    width:100%; padding:10px; border:none; background:none; color:var(--danger); font-size:13px; cursor:pointer; margin-top:4px;
  }

  .color-grid{ display:flex; gap:8px; flex-wrap:wrap; }
  .color-dot{ width:30px; height:30px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .color-dot.active{ border-color:var(--plum-900); }

  .idol-list-row{
    display:flex; align-items:center; justify-content:space-between; padding:10px 4px;
    border-bottom:1px solid var(--pink-100);
  }
  .idol-list-left{ display:flex; align-items:center; gap:10px; }
  .idol-tag-badge{ width:12px; height:12px; border-radius:50%; }
  .idol-list-name{ font-size:14px; color:var(--plum-900); }
  .idol-list-type{ font-size:11px; color:var(--plum-500); }
  .del-x{ background:none; border:none; color:var(--plum-500); font-size:16px; cursor:pointer; padding:4px; }

  .summary-card{
    background:linear-gradient(135deg,var(--pink-100),var(--lav-100)); border-radius:18px; padding:16px; margin-bottom:14px;
  }
  .summary-title{ font-size:12.5px; color:var(--plum-700); margin:0 0 8px; font-weight:500; }
  .summary-big{ font-family:'Baloo 2',sans-serif; font-size:26px; font-weight:700; color:var(--pink-700); margin:0; }
  .summary-sub{ font-size:11.5px; color:var(--plum-500); margin-top:2px; }
  .breakdown-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--pink-100); font-size:13px; }
  .breakdown-bar-bg{ height:6px; background:var(--pink-100); border-radius:4px; margin-top:5px; overflow:hidden; }
  .breakdown-bar{ height:100%; background:linear-gradient(90deg,var(--pink-400),var(--pink-600)); border-radius:4px; }

  .rate-row{ display:flex; align-items:center; gap:10px; padding:8px 0; }
  .rate-row label{ flex:1; font-size:13px; color:var(--plum-700); }
  .rate-row input{ width:100px; padding:8px 10px; border-radius:10px; border:1.5px solid var(--pink-200); font-size:13px; }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--plum-900); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13px; z-index:200; opacity:0; transition:opacity 0.25s;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  .loading-wrap{ text-align:center; padding:80px 20px; color:var(--plum-500); font-size:13.5px; }
</style>
</head>
<body>
<div class="app-wrap">
  <div class="app" id="app">
    <div class="loading-wrap">載入中…</div>
  </div>
  <button class="fab" id="fabBtn">＋</button>
</div>

<script>
(function(){

var CATEGORIES = ["專輯","小卡","演唱會","周邊","泡泡訂閱費","會員費","應援物","交通","住宿","治裝費","美甲","其他"];
var IDOL_COLORS = ["#FF7EAD","#B48EDE","#5FBE8E","#F2A94C","#6FB6E0","#E85D6B","#D4A5F0","#8CC7B8","#F0A8C0","#A5B4E8"];

var state = {
  idols: [],
  items: [],
  trades: [],
  filterIdol: "all",
  tab: "expense",
  wishFilter: "all",
  rates: { KRW: 0.023, JPY: 0.21, TWD: 1 },
  loaded: false
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtMoney(n){ return Math.round(n).toLocaleString('zh-TW'); }
function toTWD(price, currency){
  var r = state.rates[currency] != null ? state.rates[currency] : 1;
  return price * r;
}
function fmtDate(d){
  if(!d) return "";
  var dt = new Date(d);
  if(isNaN(dt)) return d;
  return (dt.getMonth()+1)+"/"+dt.getDate()+" "+dt.getFullYear();
}

function toast(msg){
  var t = document.getElementById('toastEl');
  if(!t){
    t = document.createElement('div');
    t.id = 'toastEl'; t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ---------- STORAGE (Firebase Realtime Database) ---------- */
var FIREBASE_URL = "https://idol-expense-default-rtdb.asia-southeast1.firebasedatabase.app";

async function fbGet(path){
  try{
    var res = await fetch(FIREBASE_URL + "/" + path + ".json");
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function fbPut(path, data){
  try{
    var res = await fetch(FIREBASE_URL + "/" + path + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    return res.ok;
  }catch(e){ return false; }
}
async function fbDelete(path){
  try{
    var res = await fetch(FIREBASE_URL + "/" + path + ".json", { method: "DELETE" });
    return res.ok;
  }catch(e){ return false; }
}

async function loadAll(){
  try{
    var idolsData = await fbGet('idols');
    state.idols = Array.isArray(idolsData) ? idolsData : [];
  }catch(e){ state.idols = []; }

  try{
    var settingsData = await fbGet('settings');
    if(settingsData && settingsData.rates) state.rates = settingsData.rates;
  }catch(e){}

  try{
    var itemsData = await fbGet('items');
    var items = itemsData ? Object.keys(itemsData).map(function(k){ return itemsData[k]; }) : [];
    items.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    state.items = items;
  }catch(e){ state.items = []; }

  try{
    var tradesData = await fbGet('trades');
    var trades = tradesData ? Object.keys(tradesData).map(function(k){ return tradesData[k]; }) : [];
    trades.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    state.trades = trades;
  }catch(e){ state.trades = []; }

  state.loaded = true;
}

async function saveIdols(){
  var ok = await fbPut('idols', state.idols);
  if(!ok) toast('儲存失敗，請檢查網路連線');
}
async function saveSettings(){
  await fbPut('settings', {rates: state.rates});
}
async function saveItem(item){
  var ok = await fbPut('items/'+item.id, item);
  if(!ok) toast('儲存失敗，請檢查網路連線');
}
async function deleteItemStorage(id){
  await fbDelete('items/'+id);
}
async function saveTrade(trade){
  var ok = await fbPut('trades/'+trade.id, trade);
  if(!ok) toast('儲存失敗，請檢查網路連線');
}
async function deleteTradeStorage(id){
  await fbDelete('trades/'+id);
}

/* ---------- SEED DEFAULT ---------- */
function ensureDefaultIdol(){
  if(state.idols.length === 0){
    state.idols.push({ id: uid(), name:"我的最愛", type:"group", color: IDOL_COLORS[0] });
  }
}

/* ---------- RENDER ---------- */
function idolById(id){
  for(var i=0;i<state.idols.length;i++) if(state.idols[i].id===id) return state.idols[i];
  return null;
}

function filteredItems(){
  return state.items.filter(function(it){
    if(state.filterIdol !== "all" && it.idolId !== state.filterIdol) return false;
    if(it.listType !== state.tab) return false;
    if(state.tab === "expense" && state.wishFilter !== "all" && it.status !== state.wishFilter) return false;
    return true;
  });
}

function computeStats(){
  var totalSpent = 0, totalSold = 0, wishlistTotal = 0;
  state.items.forEach(function(it){
    if(it.listType === 'wishlist'){
      wishlistTotal += toTWD(parseFloat(it.price)||0, it.currency);
      return;
    }
    if(it.listType !== 'expense') return;
    var twd = toTWD(parseFloat(it.price)||0, it.currency);
    if(it.action === 'sold') totalSold += twd;
    else totalSpent += twd;
  });
  return { totalSpent: totalSpent, totalSold: totalSold, net: totalSpent - totalSold, wishlistTotal: wishlistTotal };
}

function render(){
  var app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = '<div class="loading-wrap">載入中…</div>';
    return;
  }
  var stats = computeStats();
  var html = '';

  html += '<div class="hero">';
  html += '  <div class="hero-top">';
  html += '    <div><p class="hero-title">追星記帳本</p><p class="hero-sub">目前總花費 NT$ '+fmtMoney(stats.totalSpent)+'</p></div>';
  html += '    <button class="icon-btn" id="settingsBtn" title="匯率設定">⚙</button>';
  html += '  </div>';
  html += '</div>';

  html += '<div class="idol-scroll" id="idolScroll">';
  html += '  <div class="idol-chip'+(state.filterIdol==='all'?' active':'')+'" data-idol="all"><div class="idol-avatar">全部</div><div class="idol-chip-label">全部</div></div>';
  state.idols.forEach(function(idol){
    var initial = (idol.name||'').slice(0,1);
    html += '  <div class="idol-chip'+(state.filterIdol===idol.id?' active':'')+'" data-idol="'+idol.id+'">';
    html += '    <div class="idol-avatar" style="background:'+idol.color+'">'+esc(initial)+'</div>';
    html += '    <div class="idol-chip-label">'+esc(idol.name)+'</div>';
    html += '  </div>';
  });
  html += '  <div class="idol-chip-add" id="addIdolBtn"><div class="idol-avatar">＋</div><div class="idol-chip-label">新增</div></div>';
  html += '</div>';

  html += '<div class="stat-row" style="padding:0 16px;margin-top:14px;">';
  html += '    <div class="stat-card"><p class="stat-label">總支出</p><p class="stat-value">NT$ '+fmtMoney(stats.totalSpent)+'</p></div>';
  html += '    <div class="stat-card"><p class="stat-label">售出回收</p><p class="stat-value">NT$ '+fmtMoney(stats.totalSold)+'</p></div>';
  html += '    <div class="stat-card"><p class="stat-label">願望清單</p><p class="stat-value">NT$ '+fmtMoney(stats.wishlistTotal)+'</p></div>';
  html += '  </div>';

  html += '<div class="tabs">';
  html += '  <button class="tab-btn'+(state.tab==='expense'?' active':'')+'" data-tab="expense">消費清單</button>';
  html += '  <button class="tab-btn'+(state.tab==='wishlist'?' active':'')+'" data-tab="wishlist">願望清單</button>';
  html += '  <button class="tab-btn'+(state.tab==='trade'?' active':'')+'" data-tab="trade">應援交換</button>';
  html += '  <button class="tab-btn'+(state.tab==='photos'?' active':'')+'" data-tab="photos">照片牆</button>';
  html += '</div>';

  html += '<div class="content">';

  if(state.tab === 'trade'){
    var trades = state.trades.filter(function(t){
      return state.filterIdol === 'all' || t.idolId === state.filterIdol;
    });
    if(trades.length === 0){
      html += '<div class="empty-state"><div class="emoji">🔄</div><p>還沒有應援交換的貼文</p><p>點右下角的「＋」新增一筆吧</p></div>';
    } else {
      trades.forEach(function(t){ html += renderTradeCard(t); });
    }
  } else if(state.tab === 'photos'){
    html += renderPhotoWall();
  } else {
    if(state.tab === 'expense'){
      html += '<div class="filter-row">';
      var wfilters = [['all','全部'],['已到貨','已到貨'],['未到貨','未到貨'],['已售出','已售出']];
      wfilters.forEach(function(f){
        html += '<div class="filter-chip'+(state.wishFilter===f[0]?' active':'')+'" data-wfilter="'+f[0]+'">'+f[1]+'</div>';
      });
      html += '</div>';
    }
    var items = filteredItems();
    if(items.length === 0){
      html += '<div class="empty-state"><div class="emoji">🎀</div><p>還沒有任何紀錄</p><p>點右下角的「＋」新增第一筆吧</p></div>';
    } else {
      items.forEach(function(it){ html += renderItemCard(it); });
    }
  }

  html += '</div>';
  app.innerHTML = html;
  bindListEvents();
}

function statusTagClass(status){
  if(status === '已到貨') return 'tag-status-arrived';
  if(status === '未到貨') return 'tag-status-notarrived';
  if(status === '已售出') return 'tag-status-sold';
  return 'tag-status-arrived';
}

function renderItemCard(it){
  var idol = idolById(it.idolId);
  var photo = (it.photos && it.photos[0]) ? '<img class="item-photo" src="'+it.photos[0]+'">' : '<div class="item-photo">🎀</div>';
  var priceDisplay = (it.currency==='TWD'?'NT$':it.currency==='KRW'?'₩':'¥') + ' ' + fmtMoney(it.price);
  var twdNote = it.currency !== 'TWD' ? ' <span style="font-weight:400;font-size:11px;color:var(--plum-500);">(≈NT$'+fmtMoney(toTWD(it.price, it.currency))+')</span>' : '';
  var actionLabel = it.action === 'sold' ? '售出' : '支出';
  var html = '<div class="item-card" data-id="'+it.id+'">';
  html += photo;
  html += '<div class="item-main">';
  html += '  <div class="item-top-row">';
  html += '    <div><p class="item-name">'+esc(it.name)+'</p><p class="item-idol">'+(idol?esc(idol.name):'未分類')+' · '+actionLabel+'</p></div>';
  html += '    <span class="item-price'+(it.action==='sold'?' sold':'')+'">'+priceDisplay+twdNote+'</span>';
  html += '  </div>';
  html += '  <div class="item-tags">';
  html += '    <span class="tag tag-cat">'+esc(it.category)+'</span>';
  if(it.listType === 'expense'){
    html += '    <span class="tag '+statusTagClass(it.status)+'">'+esc(it.status)+'</span>';
  }
  html += '    <span class="item-date">'+fmtDate(it.date)+'</span>';
  html += '  </div>';
  html += '</div></div>';
  return html;
}

function renderTradeCard(t){
  var idol = idolById(t.idolId);
  var photo = (t.photos && t.photos[0]) ? '<img class="item-photo" src="'+t.photos[0]+'">' : '<div class="item-photo">🔄</div>';
  var statusClass = t.status === '已媒合' ? 'tag-trade-matched' : t.status === '免費發放' ? 'tag-trade-free' : t.status === '交換名單' ? 'tag-trade-list' : 'tag-trade-open';
  var html = '<div class="item-card" data-trade-id="'+t.id+'">';
  html += photo;
  html += '<div class="item-main">';
  html += '  <div class="item-top-row">';
  html += '    <div><p class="item-name">'+esc(t.name)+'</p><p class="item-idol">'+(idol?esc(idol.name):'未分類')+'</p></div>';
  html += '  </div>';
  if(t.note){ html += '  <p style="font-size:12px;color:var(--plum-500);margin:4px 0 0;">'+esc(t.note)+'</p>'; }
  html += '  <div class="item-tags">';
  html += '    <span class="tag '+statusClass+'">'+esc(t.status)+'</span>';
  html += '    <span class="item-date">'+fmtDate(t.date)+'</span>';
  html += '  </div>';
  html += '</div></div>';
  return html;
}

function renderPhotoWall(){
  var entries = [];
  state.items.forEach(function(it){
    if(state.filterIdol !== 'all' && it.idolId !== state.filterIdol) return;
    (it.photos||[]).forEach(function(p){
      entries.push({ photo: p, name: it.name, idolId: it.idolId, date: it.date });
    });
  });
  state.trades.forEach(function(t){
    if(state.filterIdol !== 'all' && t.idolId !== state.filterIdol) return;
    (t.photos||[]).forEach(function(p){
      entries.push({ photo: p, name: t.name, idolId: t.idolId, date: t.date });
    });
  });
  entries.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
  if(entries.length === 0){
    return '<div class="empty-state"><div class="emoji">📷</div><p>還沒有任何照片</p><p>在消費清單或應援交換新增紀錄時上傳照片吧</p></div>';
  }
  var html = '<div class="photo-grid">';
  entries.forEach(function(en, idx){
    var idol = idolById(en.idolId);
    html += '<div class="photo-grid-item" data-photo-idx="'+idx+'">';
    html += '  <img src="'+en.photo+'">';
    html += '  <div class="photo-caption">'+esc(en.name)+'</div>';
    html += '</div>';
  });
  html += '</div>';
  window._photoWallEntries = entries;
  return html;
}

function renderStats(){
  var stats = computeStats();
  var html = '';
  html += '<div class="summary-card">';
  html += '  <p class="summary-title">淨支出（新台幣）</p>';
  html += '  <p class="summary-big">NT$ '+fmtMoney(stats.net)+'</p>';
  html += '  <p class="summary-sub">支出 NT$'+fmtMoney(stats.totalSpent)+'　·　售出回收 NT$'+fmtMoney(stats.totalSold)+'</p>';
  html += '</div>';

  var byIdol = {};
  state.items.forEach(function(it){
    if(it.listType!=='expense' || it.action==='sold') return;
    var key = it.idolId || 'none';
    byIdol[key] = (byIdol[key]||0) + toTWD(parseFloat(it.price)||0, it.currency);
  });
  var idolKeys = Object.keys(byIdol).sort(function(a,b){ return byIdol[b]-byIdol[a]; });
  if(idolKeys.length){
    html += '<div class="summary-card" style="background:#fff;box-shadow:var(--shadow-soft);">';
    html += '<p class="summary-title">依對象花費</p>';
    var maxV = byIdol[idolKeys[0]];
    idolKeys.forEach(function(k){
      var idol = idolById(k);
      var pct = maxV>0 ? Math.round(byIdol[k]/maxV*100) : 0;
      html += '<div style="margin-bottom:10px;">';
      html += '<div class="breakdown-row" style="border:none;padding-bottom:0;"><span>'+(idol?esc(idol.name):'未分類')+'</span><span style="font-weight:500;">NT$'+fmtMoney(byIdol[k])+'</span></div>';
      html += '<div class="breakdown-bar-bg"><div class="breakdown-bar" style="width:'+pct+'%;background:'+(idol?idol.color:'var(--pink-400)')+'"></div></div>';
      html += '</div>';
    });
    html += '</div>';
  }

  var byCat = {};
  state.items.forEach(function(it){
    if(it.listType!=='expense' || it.action==='sold') return;
    byCat[it.category] = (byCat[it.category]||0) + toTWD(parseFloat(it.price)||0, it.currency);
  });
  var catKeys = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
  if(catKeys.length){
    html += '<div class="summary-card" style="background:#fff;box-shadow:var(--shadow-soft);">';
    html += '<p class="summary-title">依分類花費</p>';
    catKeys.forEach(function(k){
      html += '<div class="breakdown-row"><span>'+esc(k)+'</span><span style="font-weight:500;color:var(--pink-600);">NT$'+fmtMoney(byCat[k])+'</span></div>';
    });
    html += '</div>';
  }
  if(!idolKeys.length && !catKeys.length){
    html += '<div class="empty-state"><div class="emoji">📊</div><p>還沒有支出資料</p></div>';
  }
  return html;
}

/* ---------- ITEM MODAL (add/edit) ---------- */
function resizeImage(file, maxW, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxW / img.width);
      var w = Math.round(img.width * scale);
      var h = Math.round(img.height * scale);
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  }
  html += '</div>';

  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  function renderTradePhotoRow(){
    var row = overlay.querySelector('#tradePhotoRow');
    var h = '';
    (draft.photos||[]).forEach(function(p, idx){
      h += '<div class="photo-thumb-wrap"><img class="photo-thumb" src="'+p+'"><button class="photo-remove" data-rmtphoto="'+idx+'">✕</button></div>';
    });
    if((draft.photos||[]).length < 3){
      h += '<div class="photo-add" id="tradePhotoAddBtn">＋</div>';
    }
    row.innerHTML = h;
    var addBtn = row.querySelector('#tradePhotoAddBtn');
    if(addBtn) addBtn.onclick = function(){ overlay.querySelector('#tradePhotoInput').click(); };
    row.querySelectorAll('[data-rmtphoto]').forEach(function(btn){
      btn.onclick = function(){
        var idx = parseInt(btn.getAttribute('data-rmtphoto'),10);
        draft.photos.splice(idx,1);
        renderTradePhotoRow();
      };
    });
  }
  renderTradePhotoRow();

  overlay.querySelector('#tradePhotoInput').onchange = function(e){
    var files = Array.from(e.target.files || []);
    var remaining = 3 - (draft.photos||[]).length;
    files.slice(0, remaining).forEach(function(file){
      resizeImage(file, 700, function(dataUrl){
        draft.photos = draft.photos || [];
        draft.photos.push(dataUrl);
        renderTradePhotoRow();
      });
    });
    e.target.value = '';
  };

  overlay.querySelectorAll('[data-tradestatus]').forEach(function(btn){
    btn.onclick = function(){
      overlay.querySelectorAll('[data-tradestatus]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      draft.status = btn.getAttribute('data-tradestatus');
    };
  });

  overlay.querySelector('#closeTradeModal').onclick = function(){ closeModal(overlay); };
  overlay.onclick = function(e){ if(e.target===overlay) closeModal(overlay); };
  var cancelBtn = overlay.querySelector('#cancelTradeBtn');
  if(cancelBtn) cancelBtn.onclick = function(){ closeModal(overlay); };

  var deleteBtn = overlay.querySelector('#deleteTradeBtn');
  if(deleteBtn){
    deleteBtn.onclick = async function(){
      if(!confirm('確定要刪除這筆應援交換貼文嗎？')) return;
      state.trades = state.trades.filter(function(t){ return t.id !== draft.id; });
      await deleteTradeStorage(draft.id);
      closeModal(overlay);
      render();
      toast('已刪除');
    };
  }

  overlay.querySelector('#saveTradeBtn').onclick = async function(){
    var name = overlay.querySelector('#tradeName').value.trim();
    if(!name){ toast('請輸入商品名稱'); return; }
    if(!overlay.querySelector('#tradeIdolSelect').value){ toast('請先新增追星對象'); return; }

    draft.idolId = overlay.querySelector('#tradeIdolSelect').value;
    draft.name = name;
    draft.note = overlay.querySelector('#tradeNote').value.trim();
    draft.date = overlay.querySelector('#tradeDate').value || new Date().toISOString().slice(0,10);

    var existingIdx = state.trades.findIndex(function(t){ return t.id === draft.id; });
    if(existingIdx >= 0) state.trades[existingIdx] = draft;
    else state.trades.unshift(draft);

    state.trades.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });

    await saveTrade(draft);
    closeModal(overlay);
    render();
    toast(isEdit ? '已儲存變更' : '已新增貼文');
  };
}

/* ---------- PHOTO WALL LIGHTBOX ---------- */
function openLightbox(entry){
  var idol = idolById(entry.idolId);
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay center';
  var html = '';
  html += '<div class="modal-sheet">';
  html += '  <div class="modal-head"><p class="modal-title">'+esc(entry.name)+'</p><button class="modal-close" id="closeLightbox">✕</button></div>';
  html += '  <img class="lightbox-img" src="'+entry.photo+'">';
  html += '  <p style="font-size:12.5px;color:var(--plum-500);margin:0 0 4px;">'+(idol?esc(idol.name):'未分類')+' · '+fmtDate(entry.date)+'</p>';
  html += '</div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeLightbox').onclick = function(){ closeModal(overlay); };
  overlay.onclick = function(e){ if(e.target===overlay) closeModal(overlay); };
}

function closeModal(overlay){
  if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
}

/* ---------- INIT ---------- */
async function init(){
  await loadAll();
  ensureDefaultIdol();
  if(state.idols.length && !idolById(state.filterIdol) && state.filterIdol !== 'all'){
    state.filterIdol = 'all';
  }
  render();
}
init();

})();
</script>
